name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Check formatting
        run: test -z "$(gofmt -s -l .)"
      - name: Vet
        run: go vet ./...
      - name: Vet (integration build tag)
        run: go vet -tags=integration ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: Check sqlc generated code is current
        run: |
          sqlc generate
          git diff --exit-code -- internal/store/postgres/sqlc
      - name: Check OpenAPI contract is current
        run: go run ./cmd/openapi -check openapi/reusery-v1.json
      - name: Check MCP tool contract is current
        run: go run ./cmd/mcpcontract -check mcp/reusery-tools-v1.json
      - name: Integration tests (real PostgreSQL via Testcontainers)
        run: go test -tags=integration ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
